# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    strategy:
      # Let every OS leg run to completion: one leg's failure cancelling the others
      # hides whether a problem is platform-specific and slows the diagnosis loop.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Generous ceiling: packing the Coyote fork from source alone takes 2-9 minutes depending
    # on the leg (windows is slowest), before restore + build + tests + rewrite + systematic
    # tests even start. The windows leg reached the 9th minute before the rewrite step, so a
    # 10-minute ceiling kills healthy runs.
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Build Coyote fork packages
      # Packs Microsoft.Coyote from the timonkrebs/coyote fork (pinned commit) into
      # the local feed that nuget.config maps 'Microsoft.Coyote*' to. The fork adds
      # .NET 10 support and models System.Threading.Lock, which MemoizR's systematic
      # tests require; no published feed carries those changes yet.
      shell: bash
      run: bash eng/build-coyote-packages.sh
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    # Run the regular suite against clean (non-instrumented) assemblies. Coyote's binary
    # rewrite is only needed by the systematic CoyoteTests below; running the whole suite
    # against rewritten assemblies changes exception/timing semantics and adds per-operation
    # overhead, which makes the timing-sensitive tests fail.
    - name: Test
      run: dotnet test --no-build --verbosity normal --filter "FullyQualifiedName!~CoyoteTests"
    - name: Install Coyote CLI
      run: |
        # The CLI comes from the timonkrebs/coyote fork, which can rewrite net10.0
        # assemblies and control System.Threading.Lock. No --add-source here: NuGet
        # rejects it when nuget.config declares package source mapping, and the mapping
        # already routes Microsoft.Coyote* to the local packages/coyote feed.
        dotnet tool install --global Microsoft.Coyote.CLI --version 1.8.0-net10.2
        echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
    - name: Coyote Rewrite
      run: |
        # Build output follows the artifacts layout (UseArtifactsOutput in
        # Directory.Build.props). Rewrite in dependency order.
        cd artifacts/bin/MemoizR.Tests/debug/
        coyote rewrite MemoizR.StructuredAsyncLock.dll
        coyote rewrite MemoizR.dll
        coyote rewrite MemoizR.Reactive.dll
        coyote rewrite MemoizR.StructuredConcurrency.dll
        coyote rewrite MemoizR.Tests.dll
    # Only the systematic concurrency test runs against the rewritten assemblies, where
    # Coyote can fully control scheduling.
    - name: Coyote systematic test
      run: dotnet test --no-build --verbosity normal --filter "FullyQualifiedName~CoyoteTests"

  cognitive-complexity:
    # Gate on SonarSource Cognitive Complexity (rule S3776). The opt-in
    # MeasureCognitiveComplexity build (see Directory.Build.props) enables only
    # S3776 with a per-method threshold of 15 (SonarLint.xml); WarningsAsErrors
    # escalates any method above it to a build error. Single-OS: the metric is
    # platform-independent, so there's no need to run it across the matrix.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Build Coyote fork packages
      shell: bash
      run: bash eng/build-coyote-packages.sh
    - name: Cognitive Complexity gate (S3776 <= 15)
      run: dotnet build -p:MeasureCognitiveComplexity=true -p:WarningsAsErrors=S3776

